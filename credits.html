<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credits - Giacomo Raina</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #e8ecf1 100%);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.1);

            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-top: 25px;

            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);

            color: white;

            text-decoration: none;

            padding: 14px 24px;

            border-radius: 12px;

            font-weight: 600;

            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>💻 Credits</h1>

        <p>
            Sito realizzato da <strong>Giacomo Raina</strong>
        </p>

        <p>
            Progetto sviluppato per il corso di Informatica.
        </p>

        <p>
            Tecnologie utilizzate:
            HTML, CSS, JavaScript e jQuery.
        </p>

        <!-- LINK RELATIVO -->
        <a href="index.html" class="btn">

            <i class="fas fa-arrow-left"></i>

            Torna alla Home

        </a>

    </div>

</body>

</html>
